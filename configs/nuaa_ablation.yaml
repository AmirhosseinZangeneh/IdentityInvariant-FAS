dataset:
  name: NUAA
  root: datasets
  partition: test
  image_size: 160
  horizontal_flip: false

model:
  name: ablation_ecnn

training:
  seed: 42
  folds: 5
  val_subject_ratio: 0.20
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  num_workers: 0
  subject_loss_weight: 0.10
  warmup_epochs: 5
  output_dir: outputs/nuaa_subject_kfold/ablation_ecnn
